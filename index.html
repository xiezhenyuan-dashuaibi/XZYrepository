<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Homepage</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#resume-section">Resume</a></li>
                <li><a href="#achievements-section">Achievements</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about">
            <!-- Introduction content will go here -->
        </section>
        <section id="resume-section">
            <!-- Resume content will be loaded here -->
        </section>
        <section id="achievements-section">
            <h2>Achievements</h2>
            <div id="achievements-list">
                <!-- Achievements list will be populated here by JavaScript -->
            </div>
            <!-- The div below (#achievement-content) is no longer used as content is shown in a modal -->
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Name</p>
    </footer>

    <div id="achievementModal" class="modal">
      <div class="modal-content">
        <span class="modal-close-button">&times;</span>
        <div id="modalAchievementContent"></div>
      </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
